<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlobalTrade &amp; Wealth Hub | Live Markets, News &amp; Academy</title>
  <style>
    :root {
      --bg-dark: #0b0e14;
      --bg-card: #131722;
      --bg-hover: #1e222d;
      --border: #2a2e39;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gold: #f7a600;   /* Bybit Gold */
      --accent-cyan: #00f0ff;   /* Bitget Cyan */
      --green: #10b981;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      line-height: 1.5;
    }

    /* Navigation */
    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo span {
      color: var(--accent-gold);
    }

    nav {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--accent-cyan);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    section {
      margin-bottom: 40px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-left: 4px solid var(--accent-gold);
      padding-left: 12px;
    }

    .section-header h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .live-badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: var(--green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Live Market Cards Grid */
    .market-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .price-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .price-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    .asset-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .asset-name {
      font-weight: 700;
      font-size: 15px;
    }

    .asset-symbol {
      color: var(--text-muted);
      font-size: 12px;
      background: var(--bg-hover);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .asset-price {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .asset-change {
      font-size: 13px;
      font-weight: 600;
    }

    .up { color: var(--green); }
    .down { color: var(--red); }

    /* Trading Terminal Layout */
    .terminal-wrapper {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 16px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    @media (max-width: 900px) {
      .terminal-wrapper {
        grid-template-columns: 1fr;
      }
    }

    .order-panel {
      background-color: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .order-panel h3 {
      font-size: 16px;
      color: var(--accent-gold);
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 10px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 6px;
      font-size: 14px;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }

    .btn-buy { background-color: var(--green); color: #000; }
    .btn-sell { background-color: var(--red); color: #fff; }
    .btn-gold { background-color: var(--accent-gold); color: #000; }
    .btn-cyan { background-color: var(--accent-cyan); color: #000; }

    /* News Hub Tabs & Cards */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background-color: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .tab-btn.active {
      background-color: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .news-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .news-tag {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .news-card h3 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .news-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .news-card a {
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }

    /* Academy & Online Earning Grid */
    .cards-3col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .info-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }

    .info-card h3 {
      margin-bottom: 10px;
      font-size: 17px;
      color: var(--text-main);
    }

    .info-card p, .info-card li {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .info-card ul {
      padding-left: 18px;
      margin-bottom: 14px;
    }

    /* Shopping & Affiliate Partner Grid */
    .partner-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }

    .partner-card {
      background: linear-gradient(145deg, #161b26, #11151d);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      text-align: center;
    }

    .partner-card h4 {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .commission-badge {
      display: inline-block;
      background: rgba(247, 166, 0, 0.15);
      color: var(--accent-gold);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    footer {
      background-color: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 40px;
    }
  </style>
</head>
