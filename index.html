<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlockPulse Curate — Live Market Charts & Specs</title>
  <style>
    :root {
      --bg: #070d19;
      --card: #0e1729;
      --card-2: #132038;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --up: #22c55e;
      --down: #ef4444;
      --warn: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-shell {
      max-width: 460px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .app-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .feed-badge {
      font-size: 0.7rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex-shrink: 0;
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #04101f;
      border-color: var(--accent);
    }

    .market-feed {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .market-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
    }

    .market-card.hidden { display: none; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .symbol-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
    }

    .symbol-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .pill {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .delta-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    .delta-badge.up { background: rgba(34, 197, 94, 0.14); color: var(--up); }
    .delta-badge.down { background: rgba(239, 68, 68, 0.14); color: var(--down); }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 10px;
      gap: 8px;
    }

    .live-price {
      font-size: 1.45rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .zone-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
    }

    .position-box {
      margin-top: 10px;
      background: var(--card-2);
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .pos-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      color: var(--muted);
      margin-bottom: 7px;
      font-variant-numeric: tabular-nums;
    }

    .pos-header strong { color: var(--text); }

    .pos-track {
      position: relative;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        rgba(245, 158, 11, 0.35),
        rgba(56, 189, 248, 0.35),
        rgba(34, 197, 94, 0.35)
      );
    }

    .pos-fill {
      height: 100%;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.55);
      transition: width 0.25s ease;
    }

    .pos-marker {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
      transition: left 0.25s ease;
    }

    .pos-bounds {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    .chart-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      margin-bottom: 6px;
      gap: 8px;
    }

    .tf-group {
      display: flex;
      gap: 6px;
    }

    .tf-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tf-btn.active {
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.45);
    }

    .tick-status {
      font-size: 0.7rem;
      color: var(--up);
      font-variant-numeric: tabular-nums;
    }

    .chart-box {
      position: relative;
      width: 100%;
      height: 175px;
      border-radius: 12px;
      overflow: hidden;
      background: #080f1d;
      border: 1px solid rgba(148, 163, 184, 0.1);
      touch-action: pan-y;
    }

    .chart-readout {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
      gap: 8px;
    }

    .chart-readout strong { color: var(--text); }

    .expand-btn {
      width: 100%;
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .specs-panel {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
    }

    .specs-panel.open { display: block; }

    .spec-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .spec-item {
      background: var(--card-2);
      border-radius: 9px;
      padding: 8px 10px;
    }

    .spec-label {
      font-size: 0.68rem;
      color: var(--muted);
      display: block;
    }

    .spec-val {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
      display: block;
    }

    .context-box {
      background: rgba(56, 189, 248, 0.06);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 9px 10px;
      color: #cbd5e1;
      line-height: 1.45;
    }

    .disclaimer {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 6px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="top-bar">
      <h1 class="app-title">BlockPulse Markets</h1>
      <span class="feed-badge" id="feedModeBadge">Syncing feeds…</span>
    </div>

    <div class="filter-bar" role="tablist" aria-label="Market categories">
      <button class="filter-btn active" data-category="ALL" type="button">All</button>
      <button class="filter-btn" data-category="CRYPTO" type="button">Crypto</button>
      <button class="filter-btn" data-category="METALS" type="button">Metals</button>
      <button class="filter-btn" data-category="FOREX" type="button">Forex</button>
    </div>

    <div class="market-feed" id="marketFeed"></div>
  </div>

  <script>
    const timeframes = {
      "1H": { mult: 0.55, step: 0.45 },
      "4H": { mult: 0.85, step: 0.75 },
      "1D": { mult: 1.0, step: 1.0 },
      "7D": { mult: 1.45, step: 1.35 }
    };

    const METALS_SPOT_URL = "https://alyawmgold.com/api/v1/spot/latest?country=USD";

    const markets = [
      {
        id: "btcusd",
        symbol: "BTC/USD",
        name: "Bitcoin",
        category: "CRYPTO",
        decimals: 2,
        unit: "$",
        swingPct: 0.014,
        specNote: "24/7 Spot · High liquidity",
        driverNote: "Watch liquidity sweeps, funding rates, and key range boundaries.",
        spotUrl: "https://api.coinbase.com/v2/prices/BTC-USD/spot",
        candlesUrl: "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=300",
        parseSpot: (d) => Number(d?.data?.amount),
        series: []
      },
      {
        id: "ethusd",
        symbol: "ETH/USD",
        name: "Ethereum",
        category: "CRYPTO",
        decimals: 2,
        unit: "$",
        swingPct: 0.018,
        specNote: "24/7 Spot · Smart contract beta",
        driverNote: "Track ETH/BTC relative strength, network activity, and range pivots.",
        spotUrl: "https://api.coinbase.com/v2/prices/ETH-USD/spot",
        candlesUrl: "https://api.exchange.coinbase.com/products/ETH-USD/candles?granularity=300",
        parseSpot: (d) => Number(d?.data?.amount),
        series: []
      },
      {
        id: "xagusd",
        symbol: "XAG/USD",
        name: "Silver",
        category: "METALS",
        decimals: 2,
        unit: "$",
        swingPct: 0.012,
        specNote: "Spot bullion / oz · Industrial + safe haven",
        driverNote: "Watch real yields, US dollar shifts, and safe-haven flows before sizing entries.",
        spotUrl: METALS_SPOT_URL,
        parseSpot: (d) => Number(d?.metals?.silver?.units?.ounce ?? d?.metals?.silver?.price ?? d?.silver),
        seedPrice: 33.44,
        series: []
      },
      {
        id: "xauusd",
        symbol: "XAU/USD",
        name: "Gold",
        category: "METALS",
        decimals: 2,
        unit: "$",
        swingPct: 0.009,
        specNote: "Spot bullion / oz · Reserve & macro hedge",
        driverNote: "Monitor sovereign yields, central bank demand, and USD index momentum.",
        spotUrl: METALS_SPOT_URL,
        parseSpot: (d) => Number(d?.metals?.gold?.units?.ounce ?? d?.metals?.gold?.price ?? d?.gold),
        seedPrice: 2695.0,
        series: []
      },
      {
        id: "eurusd",
        symbol: "EUR/USD",
        name: "Euro / US Dollar",
        category: "FOREX",
        decimals: 5,
        unit: "",
        swingPct: 0.004,
        specNote: "Major FX · 0.00010 = 1 pip",
        driverNote: "Watch rate differentials, US/EU macro prints, and London/NY overlap.",
        spotUrl: "https://api.frankfurter.app/latest?from=EUR&to=USD",
        parseSpot: (d) => Number(d?.rates?.USD),
        seedPrice: 1.0891,
        series: []
      },
      {
        id: "gbpusd",
        symbol: "GBP/USD",
        name: "British Pound / US Dollar",
        category: "FOREX",
        decimals: 5,
        unit: "",
        swingPct: 0.005,
        specNote: "Major FX · Active European/US sessions",
        driverNote: "Track BoE vs. Fed policy expectations, UK data releases, and range edges.",
        spotUrl: "https://api.frankfurter.app/latest?from=GBP&to=USD",
        parseSpot: (d) => Number(d?.rates?.USD),
        seedPrice: 1.2758,
        series: []
      }
    ];

    // Build a realistic 14-point market wave ending at anchorPrice so live price sits naturally in range
    function buildAnchoredSeries(anchorPrice, swingPct, count = 14) {
      const safePrice = Number.isFinite(anchorPrice) && anchorPrice > 0 ? anchorPrice : 100;
      const pattern = [-0.65, -0.25, -0.85, -0.35, 0.25, -0.15, 0.65, 0.15, -0.45, 0.35, -0.1, 0.2, -0.05];
      const pts = pattern.map((factor) => {
        const jitter = (Math.random() - 0.5) * 0.25;
        return Math.max(0.00001, safePrice * (1 + (factor + jitter) * swingPct));
      });
      pts.push(safePrice);
      return pts;
    }

    markets.forEach((m) => {
      m.series = buildAnchoredSeries(m.seedPrice || 100, m.swingPct);
    });

    function fmt(val, m) {
      return `${m.unit}${Number(val).toFixed(m.decimals)}`;
    }

    function getScaledSeries(m, tfKey) {
      const cfg = timeframes[tfKey] || timeframes["1H"];
      const anchor = m.series[m.series.length - 1];
      return m.series.map((v, idx) => {
        if (idx === m.series.length - 1) return anchor;
        return Math.max(0.00001, anchor + (v - anchor) * cfg.mult);
      });
    }

    function renderMarketChart(state, values, color, posPct, high, low, live) {
      const svg = state.el.querySelector("svg");
      const w = 380, h = 175, padTop = 14, padBottom = 16, padLeft = 12, padRight = 58;
      const plotW = w - padLeft - padRight;
      const plotH = h - padTop - padBottom;

      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = max - min || (Math.abs(live) * 0.01) || 1;
      const mid = (high + low) / 2;

      const toX = (i) => padLeft + (i / Math.max(values.length - 1, 1)) * plotW;
      const toY = (v) => padTop + plotH - ((v - min) / span) * plotH;

      const pts = values.map((v, i) => `${toX(i).toFixed(1)},${toY(v).toFixed(1)}`);
      const areaPts = [
        `${toX(0).toFixed(1)},${(padTop + plotH).toFixed(1)}`,
        ...pts,
        `${toX(values.length - 1).toFixed(1)},${(padTop + plotH).toFixed(1)}`
      ].join(" ");

      const lastY = toY(live);
      const highY = toY(high);
      const lowY = toY(low);
      const midY = toY(mid);

      const inspectIdx = state.hoverIndex !== null ? Math.min(state.hoverIndex, values.length - 1) : values.length - 1;
      const inspectVal = values[inspectIdx];
      const inspectX = toX(inspectIdx);
      const inspectY = toY(inspectVal);

      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      svg.innerHTML = `
        <defs>
          <linearGradient id="grad-${state.m.id}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.28" />
            <stop offset="100%" stop-color="${color}" stop-opacity="0.01" />
          </linearGradient>
        </defs>

        <line x1="${padLeft}" y1="${highY.toFixed(1)}" x2="${padLeft + plotW}" y2="${highY.toFixed(1)}"
              stroke="rgba(56,189,248,0.35)" stroke-dasharray="3,3" stroke-width="1" />
        <line x1="${padLeft}" y1="${midY.toFixed(1)}" x2="${padLeft + plotW}" y2="${midY.toFixed(1)}"
              stroke="rgba(148,163,184,0.18)" stroke-dasharray="2,4" stroke-width="1" />
        <line x1="${padLeft}" y1="${lowY.toFixed(1)}" x2="${padLeft + plotW}" y2="${lowY.toFixed(1)}"
              stroke="rgba(245,158,11,0.35)" stroke-dasharray="3,3" stroke-width="1" />

        <polygon fill="url(#grad-${state.m.id})" points="${areaPts}" />
        <polyline fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" points="${pts.join(" ")}" />

        <line x1="${padLeft}" y1="${lastY.toFixed(1)}" x2="${padLeft + plotW}" y2="${lastY.toFixed(1)}"
              stroke="#ffffff" stroke-opacity="0.35" stroke-dasharray="4,3" stroke-width="1" />
        <rect x="${padLeft + plotW + 4}" y="${Math.max(2, Math.min(h - 18, lastY - 8)).toFixed(1)}"
              width="52" height="16" rx="4" fill="${color}" />
        <text x="${padLeft + plotW + 30}" y="${Math.max(13, Math.min(h - 7, lastY + 3)).toFixed(1)}"
              fill="#05101c" font-size="8.5" font-weight="700" text-anchor="middle">
          ${Number(live).toFixed(state.m.decimals > 3 ? 3 : state.m.decimals)}
        </text>

        <circle cx="${padLeft + plotW - 2}" cy="${lastY.toFixed(1)}" r="4.5" fill="#ffffff" stroke="${color}" stroke-width="2.5" />

        <line x1="${inspectX.toFixed(1)}" y1="${padTop}" x2="${inspectX.toFixed(1)}" y2="${padTop + plotH}"
              stroke="rgba(255,255,255,0.28)" stroke-width="1" />
        <circle cx="${inspectX.toFixed(1)}" cy="${inspectY.toFixed(1)}" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
      `;

      const readoutEl = state.el.querySelector(".chart-readout");
      readoutEl.innerHTML = `
        <span>Point ${inspectIdx + 1}/${values.length}: <strong>${fmt(inspectVal, state.m)}</strong></span>
        <span>Pos: <strong>${posPct.toFixed(1)}%</strong></span>
      `;
    }

    function updateCard(state) {
      const { m, el, tf } = state;
      const vals = getScaledSeries(m, tf);
      const live = vals[vals.length - 1];
      const open = vals[0];
      const low = Math.min(...vals);
      const high = Math.max(...vals);
      const mid = (high + low) / 2;

      const deltaPct = open === 0 ? 0 : ((live - open) / open) * 100;
      const posPct = high === low ? 50 : Math.min(100, Math.max(0, ((live - low) / (high - low)) * 100));
      const fromHighPct = high === 0 ? 0 : ((live - high) / high) * 100;
      const aboveLowPct = low === 0 ? 0 : ((live - low) / low) * 100;
      const downCount = vals.filter((v, i) => i > 0 && v < vals[i - 1]).length;

      const isUp = deltaPct >= 0;
      const zone =
        posPct >= 70 ? "Upper range · Near resistance" :
        posPct <= 30 ? "Lower range · Near support" :
        "Mid-range · Balanced";

      const deltaEl = el.querySelector(".delta-badge");
      deltaEl.className = `delta-badge ${isUp ? "up" : "down"}`;
      deltaEl.textContent = `${isUp ? "+" : ""}${deltaPct.toFixed(2)}%`;

      el.querySelector(".live-price").textContent = fmt(live, m);
      el.querySelector(".zone-label").textContent = zone;
      el.querySelector(".pos-pct-val").textContent = `${posPct.toFixed(1)}%`;
      el.querySelector(".pos-fill").style.width = `${posPct}%`;
      el.querySelector(".pos-marker").style.left = `${posPct}%`;
      el.querySelector(".bound-low").textContent = `Low: ${fmt(low, m)}`;
      el.querySelector(".bound-high").textContent = `High: ${fmt(high, m)}`;

      el.querySelector(".spec-open").textContent = fmt(open, m);
      el.querySelector(".spec-mid").textContent = fmt(mid, m);
      el.querySelector(".spec-pos").textContent = `${posPct.toFixed(1)}% (${tf})`;
      el.querySelector(".spec-dist").textContent = `${fromHighPct.toFixed(2)}% high / +${aboveLowPct.toFixed(2)}% low`;
      el.querySelector(".spec-note").textContent = m.specNote;
      el.querySelector(".spec-candles").textContent = `${downCount}/${vals.length - 1} lower steps`;

      el.querySelector(".context-text").textContent =
        `${m.name} (${m.symbol}) is at ${fmt(live, m)} (${posPct.toFixed(1)}% of its ${tf} range, ${zone.toLowerCase()}, ${downCount}/${vals.length - 1} down steps). ${m.driverNote}`;

      renderMarketChart(state, vals, isUp ? "#22c55e" : "#38bdf8", posPct, high, low, live);
    }

    const feed = document.getElementById("marketFeed");
    const badge = document.getElementById("feedModeBadge");

    const cardStates = markets.map((m) => {
      const el = document.createElement("article");
      el.className = "market-card";
      el.dataset.category = m.category;
      el.innerHTML = `
        <div class="card-top">
          <div>
            <h2 class="symbol-title">${m.symbol}</h2>
            <div class="symbol-sub">${m.name}</div>
          </div>
          <div class="badges">
            <span class="pill">${m.category}</span>
            <span class="delta-badge">0.00%</span>
          </div>
        </div>

        <div class="price-row">
          <span class="live-price"></span>
          <span class="zone-label"></span>
        </div>

        <div class="position-box">
          <div class="pos-header">
            <span>Market Price Position</span>
            <strong class="pos-pct-val">0.0%</strong>
          </div>
          <div class="pos-track">
            <div class="pos-fill"></div>
            <div class="pos-marker"></div>
          </div>
          <div class="pos-bounds">
            <span class="bound-low"></span>
            <span class="bound-high"></span>
          </div>
        </div>

        <div class="chart-controls">
          <div class="tf-group">
            <button class="tf-btn active" data-tf="1H" type="button">1H</button>
            <button class="tf-btn" data-tf="4H" type="button">4H</button>
            <button class="tf-btn" data-tf="1D" type="button">1D</button>
            <button class="tf-btn" data-tf="7D" type="button">7D</button>
          </div>
          <span class="tick-status">● Tick Sync</span>
        </div>

        <div class="chart-box">
          <svg width="100%" height="100%"></svg>
        </div>
        <div class="chart-readout"></div>

        <button class="expand-btn" type="button" aria-expanded="false">
          <span>Market Specs &amp; Context</span>
          <span class="chev">▾</span>
        </button>

        <div class="specs-panel">
          <div class="spec-grid">
            <div class="spec-item"><span class="spec-label">Period Open</span><span class="spec-val spec-open"></span></div>
            <div class="spec-item"><span class="spec-label">Range Midpoint</span><span class="spec-val spec-mid"></span></div>
            <div class="spec-item"><span class="spec-label">Range Position</span><span class="spec-val spec-pos"></span></div>
            <div class="spec-item"><span class="spec-label">Distance to Bounds</span><span class="spec-val spec-dist"></span></div>
            <div class="spec-item"><span class="spec-label">Step Momentum</span><span class="spec-val spec-candles"></span></div>
            <div class="spec-item"><span class="spec-label">Market Spec</span><span class="spec-val spec-note"></span></div>
          </div>
          <div class="context-box">
            <span class="context-text"></span>
            <span class="disclaimer">Educational market commentary only — not financial advice.</span>
          </div>
        </div>
      `;

      const state = { m, el, tf: "1H", hoverIndex: null, isLive: false };

      const chartBox = el.querySelector(".chart-box");
      const updateInspectFromClientX = (clientX) => {
        const rect = chartBox.getBoundingClientRect();
        const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / Math.max(rect.width, 1)));
        state.hoverIndex = Math.round(ratio * (m.series.length - 1));
        updateCard(state);
      };

      chartBox.addEventListener("mousemove", (e) => updateInspectFromClientX(e.clientX));
      chartBox.addEventListener("touchmove", (e) => {
        if (e.touches && e.touches[0]) updateInspectFromClientX(e.touches[0].clientX);
      }, { passive: true });
      chartBox.addEventListener("mouseleave", () => {
        state.hoverIndex = null;
        updateCard(state);
      });

      const expandBtn = el.querySelector(".expand-btn");
      const panel = el.querySelector(".specs-panel");
      expandBtn.addEventListener("click", () => {
        const isOpen = panel.classList.toggle("open");
        expandBtn.setAttribute("aria-expanded", String(isOpen));
        el.querySelector(".chev").textContent = isOpen ? "▴" : "▾";
      });

      el.querySelectorAll(".tf-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          el.querySelectorAll(".tf-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          state.tf = btn.dataset.tf;
          state.hoverIndex = null;
          updateCard(state);
        });
      });

      feed.appendChild(el);
      updateCard(state);
      return state;
    });

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const selected = btn.dataset.category;
        cardStates.forEach(({ el }) => {
          const match = selected === "ALL" || el.dataset.category === selected;
          el.classList.toggle("hidden", !match);
        });
      });
    });

    async function tryLoadCandles(m, livePrice) {
      if (!m.candlesUrl) return false;
      try {
        const res = await fetch(m.candlesUrl, { cache: "no-store" });
        if (!res.ok) return false;
        const raw = await res.json();
        if (!Array.isArray(raw) || raw.length < 6) return false;
        // Coinbase candles return [time, low, high, open, close, volume] newest-first
        const closes = raw.slice(0, 14).reverse().map((c) => Number(c[4])).filter((n) => Number.isFinite(n) && n > 0);
        if (closes.length < 6) return false;
        if (Number.isFinite(livePrice) && livePrice > 0) {
          closes[closes.length - 1] = livePrice;
        }
        m.series = closes;
        return true;
      } catch (_) {
        return false;
      }
    }

    async function syncLiveSpots() {
      let liveHits = 0;
      const jsonCache = new Map();

      await Promise.all(
        cardStates.map(async (state) => {
          const { m, el } = state;
          if (!m.spotUrl || !m.parseSpot) return;
          try {
            if (!jsonCache.has(m.spotUrl)) {
              jsonCache.set(
                m.spotUrl,
                fetch(m.spotUrl, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null))
              );
            }
            const json = await jsonCache.get(m.spotUrl);
            if (!json) return;
            const price = m.parseSpot(json);
            if (Number.isFinite(price) && price > 0) {
              const gotCandles = await tryLoadCandles(m, price);
              if (!gotCandles && !state.isLive) {
                m.series = buildAnchoredSeries(price, m.swingPct, m.series.length);
              } else {
                m.series[m.series.length - 1] = price;
              }
              state.isLive = true;
              liveHits += 1;
              el.querySelector(".tick-status").textContent = "● API Live";
              updateCard(state);
            }
          } catch (_) {
            // Keep working silently with fallback/tick stream
          }
        })
      );

      badge.textContent = liveHits > 0
        ? `Live API + Tick Stream (${liveHits}/${cardStates.length})`
        : "Tick Stream Active";
    }

    syncLiveSpots();
    setInterval(syncLiveSpots, 20000);

    setInterval(() => {
      cardStates.forEach((state) => {
        const { m, tf } = state;
        const tfStep = m.series[m.series.length - 1] * m.swingPct * 0.14 * (timeframes[tf]?.step ?? 1);
        const last = m.series[m.series.length - 1];
        const move = (Math.random() - 0.49) * tfStep;
        const nextPrice = Math.max(0.00001, last + move);
        m.series = [...m.series.slice(1), nextPrice];
        updateCard(state);
      });
    }, 2500);
  </script>
</body>
</html>
